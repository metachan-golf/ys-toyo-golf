<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#174635">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ys TOYO">
  <link rel="icon" type="image/png" sizes="96x96" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <script defer src="pwa.js?v=1.9.6"></script>
  <title>ys TOYO GOLF CLUB｜ワイズ トーヨーCCの会</title>
  <meta name="robots" content="index,follow">
  <link rel="canonical" href="https://metachan-golf.github.io/ys-toyo-golf/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ys TOYO GOLF CLUB">
  <meta property="og:title" content="ys TOYO GOLF CLUB｜ワイズ トーヨーCCの会">
  <meta property="og:url" content="https://metachan-golf.github.io/ys-toyo-golf/">
  <meta property="og:image" content="https://metachan-golf.github.io/ys-toyo-golf/icon-512.png">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary">
  <script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebSite", "name": "ys TOYO GOLF CLUB", "alternateName": "ワイズ トーヨーCCの会", "url": "https://metachan-golf.github.io/ys-toyo-golf/"}</script>
  <link rel="stylesheet" href="style.css?v=1.9.6">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="config.js"></script>
  <script defer src="app.js?v=1.9.6"></script>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.png" alt="ys × TOYO ロゴ" class="brand-logo">
      <div class="brand-copy">
        <small>ys TRANS × TOYO COUNTRY CLUB</small>
        <h1>ワイズ トーヨーCCの会</h1>
        <p>ラウンド予約・参加管理</p>
      </div>
    </div>
  </header>
  <main>
    <div id="installArea" class="install-area" hidden><button type="button" id="installApp" class="secondary">スマホにインストール</button><p id="installHelp" role="status" hidden></p></div>
    <a class="button" href="https://grain-players.net/toyo/reservation" target="_blank" rel="noopener noreferrer">ゴルフ場予約サイト ↗</a>
    <p id="message" role="status" aria-live="polite"></p>

    <section id="login" data-nosnippet>
      <h2>メンバーログイン</h2>
      <form id="loginForm">
        <label>メンバー<select id="loginMember" autocomplete="username" required><option value="">選択してください</option><option value="yanaka">谷中</option><option value="moriyama">森山</option><option value="aoki">青木</option><option value="endo">遠藤</option></select></label>
        <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
        <button>ログイン</button>
      </form>
    </section>

    <section id="club" hidden data-nosnippet>
      <div class="toolbar">
        <strong id="who"></strong>
        <button id="logout" class="secondary">ログアウト</button>
      </div>
      <nav class="page-nav"><a class="button secondary" href="index.html">予約・参加登録</a><a class="button secondary" href="overview.html">みんなの参加登録状況</a></nav>
      <div id="schedulePage">
      <div class="toolbar">
        <label>表示月<select id="month"></select></label>
        <button id="reload" class="secondary">更新</button>
      </div>
      <p class="muted">○ 参加可能　△ 調整中　× 不参加　－ 未回答</p>
      <p id="deleteNotice" role="status" aria-live="polite"></p>
      <div id="rounds"></div>
      <button id="share" class="secondary">LINE共有用テキストをコピー</button>

      <section id="admin" hidden>
        <h2>予約管理</h2>
        <form id="roundForm">
          <input id="rid" type="hidden">
          <div class="fields">
            <label>予約者<select id="booker" required></select></label>
            <label>プレー日<input id="date" type="date" required></label>
            <label>コース<select id="course"><option>OUT</option><option>IN</option></select></label>
            <label>1組目<input id="time1" type="time" required></label>
            <label>2組目（任意）<input id="time2" type="time"></label>
            <label>定員<input id="capacity" type="number" min="1" max="8" value="8" required></label>
            <label>状態<select id="status"><option>仮予約</option><option>参加募集中</option><option>開催確定</option><option>開催終了</option><option>中止</option></select></label>
            <label>回答期限<input id="deadline" type="date"></label>
            <label>備考<input id="notes"></label>
          </div>
          <div class="toolbar">
            <button id="saveRound" type="submit">予約を保存</button>
            <button type="button" class="secondary" id="clearForm">新規登録に戻す</button>
          </div>
          <p id="saveNotice" role="status" aria-live="polite"></p>
        </form>
        <h3>CSV一括登録・更新</h3>
        <p class="muted">UTF-8またはShift_JISのCSVを選択。同じ予約IDは更新、CSVにない予約は保持します。新規行は予約者を指定してください。</p>
        <input id="csvFile" type="file" accept=".csv,text/csv">
        <button id="importCsv">CSV取込</button>
        <button id="exportCsv" class="secondary">全予約CSV出力</button>
        <a href="reservations-template.csv" download>CSV見本</a>
        <p id="csvNotice" role="status" aria-live="polite"></p>
      </section>
      </div>
      <section id="overview" aria-labelledby="overviewTitle">
        <div class="toolbar"><h2 id="overviewTitle">みんなの参加登録状況</h2><button id="overviewReload" class="secondary" type="button">最新情報に更新</button></div>
        <p class="muted">本日以降の予約を表示します。日付を押すと予約・参加登録ページに移動します。</p>
        <div id="overviewTable" class="overview-scroll" tabindex="0"></div>
        <p id="overviewUpdated" class="muted"></p>
      </section>
    </section>
  </main>
  <footer>ys TOYO GOLF CLUB <small>v1.9.6</small></footer>
</body>
</html>
